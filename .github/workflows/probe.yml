# Wegwerf-Diagnose: nur `actions/checkout` und ein `run`-Schritt.
# Laeuft der hier durch, liegt es an den Fremd-Actions im APK-Lauf.
name: Probe
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Runner laeuft."
          rustup --version || echo "kein rustup"
          node --version
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "kein ndk-Verzeichnis"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
