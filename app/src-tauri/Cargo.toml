[package]
name = "tory"
description = "Tory — persoenliches Dashboard als Tauri-App"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Android laedt die App als Bibliothek; `main.rs` ist nur der Desktop-Einstieg.
name = "tory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tory-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# Nimmt den OAuth-Rueckkanal `de.tory.app://oauth2` entgegen.
tauri-plugin-deep-link = "2"
